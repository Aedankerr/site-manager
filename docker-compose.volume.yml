version: '3.8'

services:
  site-manager:
    build: .
    container_name: site-manager
    ports:
      - "3010:3010"   # Admin interface
      - "3011:3011"   # Public read-only
      # To change the host port, only change the LEFT side (e.g. "8080:3011")
      # Do NOT change PUBLIC_PORT below - it must match the right side of the port mapping
    volumes:
      # Persist database outside container
      # Make sure this directory exists on host: mkdir -p ./data
      - site-manager-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=3010
      - PUBLIC_PORT=3011
      - DB_PATH=/app/data/site.db
    restart: unless-stopped

volumes:
  site-manager-data:
