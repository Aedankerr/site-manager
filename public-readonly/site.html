<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #f4f3ee;
  --ink: #050505;
  --muted: #595959;
  --soft: #deddd7;
  --rule: rgba(5,5,5,.16);
  --rule-strong: rgba(5,5,5,.34);
  --green: #0f0f0f;
  --red: #333333;
  --blue: #1e1e1e;
  --yellow: #777777;
  --white: #fbfaf6;
  --black: #050505;
  --grid-rgb: 5,5,5;
  --paper-rgb: 244,243,238;
  --white-rgb: 251,250,246;
  --text-soft: #30302c;
  --rack-muted: #aaa391;
  --inverse-line: rgba(244,243,238,.28);
  --max: 1260px;
  --hero-size: clamp(34px, 4.8vw, 64px);
  --h2-size: clamp(26px, 2.8vw, 38px);
  --body-size: 15.5px;
}

html[data-theme="dark"] {
  --paper: #080808;
  --ink: #f4f3ee;
  --muted: #a4a4a0;
  --soft: #1a1a1a;
  --rule: rgba(244,243,238,.18);
  --rule-strong: rgba(244,243,238,.38);
  --green: #f4f3ee;
  --red: #c9c9c4;
  --blue: #e1e0d9;
  --yellow: #8d8d86;
  --white: #101010;
  --black: #f4f3ee;
  --grid-rgb: 244,243,238;
  --paper-rgb: 8,8,8;
  --white-rgb: 16,16,16;
  --text-soft: #c8c8c2;
  --rack-muted: #bcbcb6;
  --inverse-line: rgba(8,8,8,.42);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  margin: 0;
  color: var(--ink);
  background:
    linear-gradient(90deg, rgba(var(--grid-rgb),.04) 1px, transparent 1px) 0 0 / 32px 32px,
    linear-gradient(rgba(var(--grid-rgb),.03) 1px, transparent 1px) 0 0 / 32px 32px,
    var(--paper);
  font-family: "IBM Plex Sans", system-ui, sans-serif;
  font-size: var(--body-size);
  letter-spacing: -.006em;
}

a { color: inherit; text-decoration: none; }
img { max-width: 100%; display: block; }

.wrap {
  width: min(var(--max), calc(100% - 36px));
  margin: 0 auto;
}

.topbar {
  border-bottom: 2px solid var(--ink);
  background: rgba(var(--paper-rgb), .92);
  position: sticky;
  top: 0;
  z-index: 20;
  backdrop-filter: blur(10px);
}

.topbar-inner {
  display: grid;
  grid-template-columns: 1fr auto auto;
  align-items: center;
  min-height: 62px;
  gap: 20px;
}

.identity {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
}

.identity strong {
  font-size: 20px;
  letter-spacing: -.04em;
  text-transform: uppercase;
}

.identity span {
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  color: var(--muted);
}

nav {
  display: flex;
  gap: 1px;
  border: 1px solid var(--ink);
  background: var(--ink);
}

nav a {
  background: var(--paper);
  padding: 10px 12px;
  font-family: "IBM Plex Mono", monospace;
  font-size: 12px;
  text-transform: uppercase;
}

nav a:hover,
nav a.active {
  background: var(--ink);
  color: var(--paper);
}

.hero { padding: 24px 0 18px; }

.dossier {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 340px;
  border: 2px solid var(--ink);
  background: rgba(var(--white-rgb), .92);
  min-height: 390px;
  box-shadow: 0 10px 26px rgba(var(--grid-rgb), .10);
}

.hero-main {
  padding: clamp(22px, 3vw, 34px);
  border-right: 2px solid var(--ink);
  position: relative;
  display: grid;
  align-content: center;
}

.file-label {
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  display: inline-grid;
  grid-auto-flow: column;
  gap: 10px;
  align-items: center;
  margin-bottom: 20px;
}

.file-label::before {
  content: "";
  width: 28px;
  height: 8px;
  background: var(--green);
  display: inline-block;
}

h1 { margin: 0; max-width: 760px; font-size: var(--hero-size); line-height: .92; letter-spacing: -.055em; text-transform: uppercase; }
.sublead { margin: 18px 0 0; max-width: 760px; font-size: clamp(15.5px, 1.35vw, 18px); line-height: 1.5; color: var(--muted); }
.hero-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }

.stamp {
  display: inline-flex;
  min-height: 38px;
  align-items: center;
  padding: 0 12px;
  border: 2px solid var(--ink);
  background: var(--paper);
  font-family: "IBM Plex Mono", monospace;
  font-size: 11px;
  text-transform: uppercase;
  box-shadow: 4px 4px 0 var(--ink);
  cursor: pointer;
}
.stamp.primary { background: var(--ink); color: var(--paper); box-shadow: 4px 4px 0 var(--green); }
.stamp:hover { transform: translate(1px, 1px); box-shadow: 3px 3px 0 var(--ink); }

.side-sheet { display: grid; grid-template-rows: 112px 1fr auto; background: var(--paper); }
.photo-box { border-bottom: 2px solid var(--ink); padding: 12px; display: grid; place-items: center; }
.portrait-placeholder { width: 100%; height: 100%; border: 2px dashed var(--rule-strong); display: grid; place-items: center; text-align: center; font-family: "IBM Plex Mono", monospace; color: var(--muted); font-size: 10px; text-transform: uppercase; background: repeating-linear-gradient(-45deg, rgba(var(--grid-rgb),.05), rgba(var(--grid-rgb),.05) 8px, transparent 8px, transparent 16px); }
.facts { padding: 0; margin: 0; list-style: none; }
.facts li { display: grid; grid-template-columns: 82px 1fr; gap: 10px; border-bottom: 1px solid var(--rule); padding: 10px 13px; }
.facts b { font-family: "IBM Plex Mono", monospace; font-size: 10px; text-transform: uppercase; color: var(--muted); }
.facts span { font-size: 13px; line-height: 1.35; }
.availability { border-top: 2px solid var(--ink); display: grid; gap: 8px; padding: 12px 13px; font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; color: var(--muted); }
.availability span { display: inline-flex; align-items: center; gap: 8px; }

.section { padding: 34px 0; }
.section-title, .section-heading { display: grid; grid-template-columns: 180px 1fr; gap: 18px; align-items: end; border-bottom: 2px solid var(--ink); margin-bottom: 16px; padding-bottom: 10px; }
.section-title code, .section-heading code { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); }
h2 { margin: 0; font-size: var(--h2-size); line-height: .95; letter-spacing: -.045em; text-transform: uppercase; }
.columns { display: grid; grid-template-columns: 180px 1fr; gap: 18px; }
.rail { font-family: "IBM Plex Mono", monospace; font-size: 12px; color: var(--muted); text-transform: uppercase; line-height: 1.65; }

.card, .case, .role, .form-card, .company { border: 2px solid var(--ink); background: rgba(var(--white-rgb), .72); }
.cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.card { padding: 18px; min-height: 190px; display: grid; align-content: space-between; }
.card h3, .case h3, .role h3 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
.card p, .case p, .role p { color: var(--text-soft); line-height: 1.55; margin: 12px 0 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.tag { border: 1px solid var(--rule-strong); padding: 5px 7px; font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; background: var(--paper); }

.work-list { display: grid; gap: 12px; }
.company-head { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: end; padding: 16px 18px; border-bottom: 2px solid var(--ink); background: rgba(var(--paper-rgb), .58); }
.company-head h3 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
.company-head p { margin: 6px 0 0; color: var(--text-soft); line-height: 1.45; }
.company-period { font-family: "IBM Plex Mono", monospace; font-size: 12px; text-transform: uppercase; color: var(--muted); white-space: nowrap; }
.role-stack { position: relative; padding: 6px 0; }
.role-stack::before { content: ""; position: absolute; left: 151px; top: 18px; bottom: 18px; width: 2px; background: var(--ink); opacity: .28; }
.role-step { display: grid; grid-template-columns: 132px 1fr; gap: 20px; padding: 14px 18px; position: relative; }
.role-step::before { content: ""; position: absolute; left: 145px; top: 24px; width: 14px; height: 14px; border: 2px solid var(--ink); background: var(--paper); }
.role-step.current::before { background: var(--ink); }
.role-step + .role-step { border-top: 1px solid var(--rule); }
.role-date { font-family: "IBM Plex Mono", monospace; font-size: 11px; line-height: 1.45; text-transform: uppercase; color: var(--muted); }
.role-content h4 { margin: 0; font-size: 18px; letter-spacing: -.025em; }
.role-content p { margin: 7px 0 0; color: var(--text-soft); line-height: 1.5; }
.role-content ul { margin: 9px 0 0; padding-left: 18px; color: var(--text-soft); line-height: 1.55; }

.lab { display: grid; grid-template-columns: .95fr 1.05fr; gap: 10px; }
.rack { border: 2px solid var(--ink); background: var(--black); color: var(--paper); padding: 12px; }
.rack-row { border: 1px solid var(--inverse-line); min-height: 58px; margin-bottom: 8px; display: grid; grid-template-columns: 82px 1fr auto; gap: 12px; align-items: center; padding: 10px; font-family: "IBM Plex Mono", monospace; font-size: 12px; }
.status, .led { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.case-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.case { padding: 18px; min-height: 172px; }
.case .num { font-family: "IBM Plex Mono", monospace; color: var(--red); font-size: 12px; margin-bottom: 20px; display: block; }
.matrix { display: grid; grid-template-columns: repeat(4, 1fr); border: 2px solid var(--ink); border-right: 0; border-bottom: 0; }
.cell { min-height: 154px; border-right: 2px solid var(--ink); border-bottom: 2px solid var(--ink); padding: 14px; background: rgba(251,247,234,.48); }
.cell h3 { margin: 0 0 14px; font-family: "IBM Plex Mono", monospace; font-size: 12px; text-transform: uppercase; color: var(--blue); }
.cell ul { list-style: none; margin: 0; padding: 0; color: var(--text-soft); line-height: 1.75; font-size: 14px; }

.form-card { padding: 18px; }
.form-card h3 { margin: 0; font-size: 22px; letter-spacing: -.035em; }
.form-card p { color: var(--text-soft); line-height: 1.55; margin: 12px 0 0; }
.referee { display: grid; grid-template-columns: .95fr 1.05fr; gap: 10px; }
.form-card label { display: grid; gap: 6px; margin-bottom: 10px; font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; color: var(--muted); }
.form-card input, .form-card select, .form-card textarea { width: 100%; border: 1px solid var(--rule-strong); background: var(--paper); color: var(--ink); padding: 10px; font: 13px/1.45 "IBM Plex Mono", monospace; }
.form-card textarea { min-height: 118px; resize: vertical; }

.theme-switcher { position: fixed; right: 18px; bottom: 18px; z-index: 40; display: flex; gap: 0; border: 2px solid var(--ink); background: var(--ink); box-shadow: 0 8px 20px rgba(0,0,0,.12); }
.theme-switcher button { min-height: 42px; border: 0; border-right: 1px solid var(--ink); background: var(--paper); color: var(--ink); padding: 0 12px; font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; cursor: pointer; }
.theme-switcher button[aria-pressed="true"] { background: var(--ink); color: var(--paper); outline: 1px solid var(--paper); outline-offset: -4px; }

.empty-page-card { border: 2px solid var(--ink); background: rgba(var(--white-rgb), .72); padding: 24px; }
footer { border-top: 2px solid var(--ink); padding: 24px 0; margin-top: 34px; font-family: "IBM Plex Mono", monospace; font-size: 11px; text-transform: uppercase; color: var(--muted); }
.spinner { display: grid; place-items: center; padding: 80px 0; font-family: "IBM Plex Mono", monospace; text-transform: uppercase; color: var(--muted); }



body.theme-grid-off {
  background: var(--paper);
}
body.theme-density-compact { --hero-size: clamp(30px, 4.2vw, 54px); --h2-size: clamp(23px, 2.4vw, 32px); --density-section: 22px; --density-hero: 16px; --density-panel: 18px; }
body.theme-density-normal { --density-section: 34px; --density-hero: 24px; --density-panel: clamp(22px, 3vw, 34px); }
body.theme-density-spacious { --hero-size: clamp(38px, 5.4vw, 72px); --h2-size: clamp(30px, 3.2vw, 44px); --density-section: 50px; --density-hero: 38px; --density-panel: clamp(30px, 4vw, 48px); }
body.theme-density-compact .section { padding: var(--density-section) 0; }
body.theme-density-normal .section { padding: var(--density-section) 0; }
body.theme-density-spacious .section { padding: var(--density-section) 0; }
body.theme-density-compact .hero,
body.theme-density-normal .hero,
body.theme-density-spacious .hero { padding-top: var(--density-hero); padding-bottom: calc(var(--density-hero) * .75); }
body.theme-density-compact .hero-main,
body.theme-density-normal .hero-main,
body.theme-density-spacious .hero-main { padding: var(--density-panel); }

.topbar-actions { display: flex; gap: 8px; align-items: center; }
.print-only { display: none !important; }
.photo-box img { max-width: 100%; max-height: 100%; object-fit: contain; border: 1px solid var(--rule-strong); }
.portrait-placeholder.no-pattern { background: transparent; }

@media print {
  @page {
    size: A4;
    margin: 12mm;
  }

  html,
  body {
    background: #fff !important;
    color: #000 !important;
  }

  .no-print,
  nav,
  button,
  .admin-only,
  .interactive-only,
  .theme-switcher,
  .topbar-actions,
  footer {
    display: none !important;
  }

  .print-only {
    display: block !important;
  }

  * {
    box-shadow: none !important;
    text-shadow: none !important;
  }

  main,
  section,
  article,
  .panel,
  .card,
  .dossier-card,
  .project-card,
  .cv-entry,
  .case,
  .role,
  .company,
  .form-card {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .avoid-break {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .pdf-page-break {
    break-before: page;
    page-break-before: always;
  }

  a {
    color: #000 !important;
    text-decoration: none;
  }

  .site-grid-background,
  .background-grid,
  .dot-grid {
    background: none !important;
  }

  .public-page,
  .page-shell,
  .content-shell,
  .wrap {
    width: 100% !important;
    max-width: none !important;
    margin: 0 !important;
  }

  .section-label,
  .section-subtitle,
  .heading-description,
  .rail {
    display: none !important;
  }

  .section-heading {
    display: grid !important;
    grid-template-columns: 120px 1fr;
    align-items: end;
    border-bottom: 2px solid #000;
    padding-bottom: 8px;
    margin-bottom: 18px;
    break-after: avoid;
  }

  .section-number {
    font-family: monospace;
    font-size: 10pt;
    font-weight: 400;
  }

  .section-title-text {
    font-size: 24pt;
    line-height: 1;
    font-weight: 900;
    text-transform: uppercase;
    margin: 0;
  }
}

@media (max-width: 900px) {
  .topbar-inner, .dossier, .columns, .referee, .lab { grid-template-columns: 1fr; }
  .hero-main { border-right: 0; border-bottom: 2px solid var(--ink); }
  .cards, .case-grid, .matrix { grid-template-columns: 1fr; }
  .section-title { grid-template-columns: 1fr; }
  nav { overflow-x: auto; }
}


/* Readable brutalist focus states: outline-only, never black-fill text inputs */
input,
textarea,
select,
.field {
  background: #fff;
  color: #000;
  border: 2px solid #000;
}

input:focus,
textarea:focus,
select:focus,
.field:focus {
  background: #fff !important;
  color: #000 !important;
  border-color: #000 !important;
  outline: 3px solid #000;
  outline-offset: 2px;
}

input::selection,
textarea::selection,
.field::selection {
  background: #000;
  color: #fff;
}

button:focus,
.button:focus {
  outline: 3px solid #000;
  outline-offset: 2px;
}

button:focus:not(.primary),
.button:focus:not(.primary) {
  background: inherit;
  color: inherit;
}

</style>
</head>
<body class="theme-github-pages-dossier">
<header class="topbar">
  <div class="wrap topbar-inner">
    <a href="/" class="identity">
      <strong id="siteName">Site</strong>
      <span id="siteDescriptor">self hosted portfolio manager</span>
    </a>
    <nav aria-label="site navigation" id="navLinks"></nav>
    <div class="topbar-actions no-print"><button class="stamp" type="button" onclick="window.print()">Export PDF</button></div>
  </div>
</header>

<main id="pageContent"></main>

<footer>
  <div class="wrap" id="footerText">Built with Site Manager</div>
</footer>

<div class="theme-switcher" aria-label="theme switcher">
  <button type="button" data-theme-button="light" aria-pressed="true" onclick="setDesignTheme('light')">Light</button>
  <button type="button" data-theme-button="dark" aria-pressed="false" onclick="setDesignTheme('dark')">Dark</button>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  ROUTER
// ═══════════════════════════════════════════════════════
const routes = {
  '/':          'home',
  '/projects':  'projects',
  '/cv':        'cv',
  '/contact':   'contacts',
  '/contacts':  'contacts',
};

const defaultSiteSettings = {
  siteTitle: "SITE",
  siteTagline: "self hosted portfolio manager",
  headerButtons: [],
  heroMedia: {
    enabled: true,
    imageUrl: "",
    altText: "Project graphic",
    placeholderText: "OPTIONAL LOGO OR PROJECT GRAPHIC"
  },
  theme: {
    showGrid: true,
    showHeroMediaPattern: true,
    showMetadataPanel: true,
    showSystemStatus: true,
    density: "normal"
  },
  siteStructure: {
    mode: "multi-page",
    singlePageOrder: ["home", "projects", "cv", "contact"],
    enabledSections: {
      home: true,
      projects: true,
      cv: true,
      contact: true
    }
  }
};

let siteSettings = { ...defaultSiteSettings };

function parseSettingObject(value, fallback) {
  if (value && typeof value === 'object') return value;
  if (typeof value === 'string' && value.trim()) {
    try { return JSON.parse(value); } catch {}
  }
  return fallback;
}

function mergeSiteSettings(raw = {}) {
  const heroMedia = { ...defaultSiteSettings.heroMedia, ...parseSettingObject(raw.heroMedia, {}) };
  const theme = { ...defaultSiteSettings.theme, ...parseSettingObject(raw.theme, {}) };
  if (!['compact', 'normal', 'spacious'].includes(theme.density)) theme.density = 'normal';
  const rawStructure = parseSettingObject(raw.siteStructure, {});
  const siteStructure = {
    ...defaultSiteSettings.siteStructure,
    ...rawStructure,
    enabledSections: {
      ...defaultSiteSettings.siteStructure.enabledSections,
      ...(rawStructure.enabledSections || {})
    }
  };
  if (!['multi-page', 'single-page'].includes(siteStructure.mode)) siteStructure.mode = 'multi-page';
  if (!Array.isArray(siteStructure.singlePageOrder)) siteStructure.singlePageOrder = defaultSiteSettings.siteStructure.singlePageOrder;
  return {
    ...raw,
    siteTitle: raw.siteTitle || raw.site_name || defaultSiteSettings.siteTitle,
    siteTagline: raw.siteTagline || raw.site_description || defaultSiteSettings.siteTagline,
    headerButtons: Array.isArray(parseSettingObject(raw.headerButtons, [])) ? parseSettingObject(raw.headerButtons, []).filter(b => b && (b.text || b.url)) : [],
    heroMedia,
    theme,
    siteStructure
  };
}

function canonicalSlug(slug) { return slug === 'contact' ? 'contacts' : slug; }
function settingsSlug(slug) { return slug === 'contacts' ? 'contact' : slug; }


// Figure out which slug to load from the URL path
function getSlugFromPath(pathname = window.location.pathname) {
  const path = pathname.replace(/\/$/, '') || '/';
  if (routes[path]) return routes[path];
  const slug = decodeURIComponent(path.replace(/^\//, '')).trim();
  return slug || 'home';
}
function getSlug() { return getSlugFromPath(); }

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
async function init() {
  let pages = [];
  try { pages = await fetch('/api/pages').then(r => r.json()); } catch {}

  try {
    siteSettings = mergeSiteSettings(await fetch('/api/site').then(r => r.json()));
  } catch { siteSettings = mergeSiteSettings({}); }

  document.getElementById('siteName').textContent = siteSettings.siteTitle;
  document.title = siteSettings.siteTitle;
  document.querySelector('meta[name="description"]').content = siteSettings.siteTagline;
  const descriptor = document.getElementById('siteDescriptor');
  if (descriptor) descriptor.textContent = siteSettings.siteTagline;
  applySiteTheme(siteSettings.site_theme || 'default');
  applyThemeSettings(siteSettings.theme);

  buildNav(pages);
  renderHeaderButtons(siteSettings.headerButtons);
  await applyCustomCss();

  if (siteSettings.siteStructure.mode === 'single-page') await loadSinglePage(pages);
  else await loadPage(getSlug());
}

function applySiteTheme(theme) {
  const allowed = ['default', 'github-pages-dossier'];
  if (!allowed.includes(theme)) theme = 'github-pages-dossier';
  document.body.classList.remove(...allowed.map(t => `theme-${t}`));
  document.body.classList.add(`theme-${theme}`);
  setDesignTheme(localStorage.getItem('site-theme-mode') || 'light');
}

function applyThemeSettings(theme = defaultSiteSettings.theme) {
  document.body.classList.toggle('theme-grid-off', theme.showGrid === false);
  document.body.classList.remove('theme-density-compact', 'theme-density-normal', 'theme-density-spacious');
  document.body.classList.add(`theme-density-${theme.density || 'normal'}`);
}

function setDesignTheme(mode) {
  const theme = mode === 'dark' ? 'dark' : 'light';
  document.documentElement.dataset.theme = theme;
  try { localStorage.setItem('site-theme-mode', theme); } catch {}
  document.querySelectorAll('[data-theme-button]').forEach(btn => {
    btn.setAttribute('aria-pressed', btn.dataset.themeButton === theme ? 'true' : 'false');
  });
}

async function applyCustomCss() {
  try {
    const settings = await fetch('/api/settings').then(r => r.json());
    const css = String(settings.customCss || '').replace(/<\/style>/gi, '');
    let style = document.getElementById('custom-css');
    if (!css) { if (style) style.remove(); return; }
    if (!style) {
      style = document.createElement('style');
      style.id = 'custom-css';
      document.head.appendChild(style);
    }
    style.textContent = css;
  } catch {}
}

function buildNav(pages) {
  const slugToPath = { home: '/', projects: '/projects', cv: '/cv', contacts: '/contact', contact: '/contact' };
  const singlePageAnchorExample = 'href="#projects"';
  const currentSlug = getSlug();
  const enabled = siteSettings.siteStructure.enabledSections || defaultSiteSettings.siteStructure.enabledSections;
  const visiblePages = pages.filter(p => p.visible !== false && enabled[settingsSlug(p.slug)] !== false);
  const html = visiblePages.map(p => {
    const publicSlug = settingsSlug(p.slug);
    const href = siteSettings.siteStructure.mode === 'single-page' ? `#${publicSlug}` : (slugToPath[p.slug] || ('/' + p.slug));
    const active = siteSettings.siteStructure.mode === 'single-page' ? '' : (p.slug === currentSlug ? 'active' : '');
    return `<a href="${href}" class="nav-link ${active}">${escHtml(p.title)}</a>`;
  }).join('');
  document.getElementById('navLinks').innerHTML = html;
}

function renderHeaderButtons(headerButtons = []) {
  const actions = document.querySelector('.topbar-actions');
  if (!actions) return;
  const extra = (Array.isArray(headerButtons) ? headerButtons : [])
    .filter(b => b && b.text && b.url)
    .map(b => `<a class="stamp" href="${escAttr(b.url)}">${escHtml(b.text)}</a>`)
    .join('');
  actions.innerHTML = `${extra}<button class="stamp" type="button" onclick="window.print()">Export PDF</button>`;
}

async function loadPage(slug) {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="spinner">Loading dossier…</div>';
  try {
    const blocks = await fetch(`/api/pages/${slug}/blocks`).then(r => r.json());
    if (!blocks.length) {
      content.innerHTML = renderEmptyPage(slug);
      return;
    }
    content.innerHTML = blocks.map(b => renderBlock(b)).join('');
    // Trigger animations
    content.querySelectorAll('.fade-up').forEach((el, i) => {
      el.style.animationDelay = (i * 0.08) + 's';
    });
  } catch (err) {
    content.innerHTML = '<div class="max-w-2xl mx-auto px-6 py-32 text-center text-gray-400">Failed to load content.</div>';
  }
}


async function loadSinglePage(pages) {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="spinner">Loading dossier…</div>';
  const enabled = siteSettings.siteStructure.enabledSections || defaultSiteSettings.siteStructure.enabledSections;
  const order = siteSettings.siteStructure.singlePageOrder || defaultSiteSettings.siteStructure.singlePageOrder;
  const pageMap = new Map(pages.map(p => [settingsSlug(p.slug), p]));
  const chunks = [];
  for (const publicSlug of order) {
    if (enabled[publicSlug] === false) continue;
    const page = pageMap.get(publicSlug) || { slug: canonicalSlug(publicSlug), title: publicSlug };
    const apiSlug = canonicalSlug(page.slug);
    try {
      const blocks = await fetch(`/api/pages/${apiSlug}/blocks`).then(r => r.json());
      if (!blocks.length) chunks.push(renderEmptyPage(publicSlug));
      else chunks.push(blocks.map(b => renderBlock(b, publicSlug)).join(''));
    } catch {
      chunks.push(renderEmptyPage(publicSlug));
    }
  }
  content.innerHTML = chunks.join('');
}

function renderEmptyPage(slug) {
  const pageName = ({ home: 'Home', projects: 'Projects', cv: 'CV', contacts: 'Contact' }[slug]) || 'Page';
  return `
  <section class="section wrap empty-page-shell">
    ${renderSectionHeading(pageName, "Start building this page")}
    <div class="columns">
      <aside class="rail">Fresh install. No demo content has been seeded.</aside>
      <div class="empty-page-card">
        <p>This page is intentionally empty on a fresh install. Open the admin interface, add sections, and publish your own content when you are ready.</p>
      </div>
    </div>
  </section>`;
}

// ═══════════════════════════════════════════════════════
//  BLOCK RENDERERS
// ═══════════════════════════════════════════════════════
function renderBlock(block, pageSlug = '') {
  const c = block.content || {};
  const publicSlug = settingsSlug(pageSlug || block.page_slug || '');
  switch (block.type) {
    case 'hero':         return renderHero(c, publicSlug || 'home');
    case 'projects_grid': return renderProjectsGrid(c, publicSlug || 'projects');
    case 'timeline':     return renderTimeline(c, publicSlug || 'cv');
    case 'contact':      return renderContact(c, publicSlug || 'contact');
    default:             return '';
  }
}

// ── Hero
function renderHero(c, sectionId = 'home') {
  const title = c.title || document.getElementById('siteName')?.textContent || 'Project Name';
  const subtitle = c.subtitle || 'Short project description or primary user value.';
  const buttons = normaliseHeroButtons(c);
  const facts = normaliseFacts(c.facts, title, subtitle);
  const showMetadata = siteSettings.theme.showMetadataPanel !== false;
  const showStatus = siteSettings.theme.showSystemStatus !== false;
  const heroMedia = renderHeroMedia(siteSettings.heroMedia, siteSettings.theme);
  const showSideSheet = heroMedia || showMetadata || showStatus;
  return `
  <section class="hero wrap" id="${escAttr(sectionId)}">
    <div class="dossier">
      <div class="hero-main">
        <div class="file-label">${escHtml(c.file_label || 'Technical dossier')}</div>
        <h1>${escHtml(title)}</h1>
        <h2 class="sublead">${escHtml(subtitle)}</h2>
        ${renderHeroButtons(buttons)}
      </div>
      ${showSideSheet ? `<aside class="side-sheet" aria-label="project facts">
        ${heroMedia}
        ${showMetadata ? `<ul class="facts">${facts.map(f => `<li><b>${escHtml(f.label)}</b><span>${escHtml(f.value)}</span></li>`).join('')}</ul>` : ''}
        ${showStatus ? `<div class="availability"><span><i class="led"></i> system active</span><span>self hosted</span></div>` : ''}
      </aside>` : ''}
    </div>
  </section>`;
}


function normaliseHeroButtons(c = {}) {
  if (Array.isArray(c.buttons) && c.buttons.length) return c.buttons.filter(b => b && (b.text || b.url));
  const buttons = [];
  if (c.primary_button_text || c.primary_button_link) buttons.push({ text: c.primary_button_text || 'Primary action', url: c.primary_button_link || '#', primary: true });
  if (!buttons.length) buttons.push({ text: 'Projects', url: siteSettings.siteStructure.mode === 'single-page' ? '#projects' : '/projects', primary: true });
  buttons.push({ text: 'Timeline', url: siteSettings.siteStructure.mode === 'single-page' ? '#cv' : '/cv' });
  return buttons;
}

function renderHeroButtons(buttons = []) {
  const visible = buttons.filter(b => b && b.text && b.url);
  if (!visible.length) return '';
  return `<div class="hero-actions no-print">${visible.map((b, i) => `<a class="stamp ${b.primary || i === 0 ? 'primary' : ''}" href="${escAttr(b.url)}">${escHtml(b.text)}</a>`).join('')}</div>`;
}

function renderHeroMedia(media = defaultSiteSettings.heroMedia, theme = defaultSiteSettings.theme) {
  if (media.enabled === false) return '';
  if (media.imageUrl) {
    return `<div class="photo-box"><img src="${escAttr(media.imageUrl)}" alt="${escAttr(media.altText || 'Project graphic')}"></div>`;
  }
  const patternClass = theme.showHeroMediaPattern === false ? ' no-pattern' : '';
  const text = media.placeholderText || defaultSiteSettings.heroMedia.placeholderText;
  return `<div class="photo-box"><div class="portrait-placeholder${patternClass}">${escHtml(text)}</div></div>`;
}
function normaliseFacts(facts, title, subtitle) {
  if (Array.isArray(facts) && facts.length) return facts.map(f => ({ label: f.label || f.key || 'Fact', value: f.value || '' }));
  return [
    { label: 'Name', value: title || 'Project Name' },
    { label: 'Status', value: 'Active' },
    { label: 'Stack', value: 'Docker · API · Static public site' },
    { label: 'Focus', value: subtitle || 'Editable site content' },
  ];
}


function renderSectionHeading(kicker, title) {
  const raw = String(kicker || '').trim();
  const match = raw.match(/^([^/]+\/)(?:\s*(.*))?$/);
  const number = match ? match[1].trim() : raw;
  const label = match ? (match[2] || '') : '';
  return `<div class="section-heading"><code><span class="section-number">${escHtml(number)}</span> <span class="section-label">${escHtml(label)}</span></code><h2 class="section-title-text">${escHtml(title)}</h2></div>`;
}

// ── Projects Grid
function renderProjectsGrid(c, sectionId = 'projects') {
  const projects = c.projects || [];
  const title = c.title || 'Projects';
  const kicker = c.kicker || '02 / projects';
  const rail = c.rail || 'Selected items rendered as heavy bordered dossier cards.';
  return `
  <section class="section wrap" id="${escAttr(sectionId)}">
    ${renderSectionHeading(kicker, title)}
    <div class="columns">
      <aside class="rail">${escHtml(rail)}</aside>
      <div class="cards">${projects.map(p => projectCard(p)).join('')}</div>
    </div>
  </section>`;
}

function projectCard(p) {
  const techList = Array.isArray(p.tech_stack) ? p.tech_stack : (p.tech_stack || '').split(',').map(s => s.trim()).filter(Boolean);
  return `
  <article class="card">
    <div>
      <h3>${escHtml(p.name || 'Untitled')}</h3>
      ${p.description ? `<p>${escHtml(p.description)}</p>` : ''}
    </div>
    <div>
      ${techList.length ? `<div class="tags">${techList.map(t => `<span class="tag">${escHtml(t)}</span>`).join('')}</div>` : ''}
      ${p.link ? `<div class="hero-actions"><a class="stamp" href="${escAttr(p.link)}" target="_blank" rel="noopener">View Project</a></div>` : ''}
    </div>
  </article>`;
}

// ── Timeline
function renderTimeline(c, sectionId = 'cv') {
  const items = c.items || [];
  const title = c.title || 'Timeline';
  const kicker = c.kicker || '01 / timeline';
  const sidebar = c.sidebar || 'Group related items so progression reads as a connected sequence.';
  const groups = groupTimelineByEmployer(items);
  return `
  <section class="section wrap" id="${escAttr(sectionId)}">
    ${renderSectionHeading(kicker, title)}
    <div class="columns">
      <aside class="rail">${escHtml(sidebar)}</aside>
      <div class="work-list">${groups.map(group => employerCard(group)).join('')}</div>
    </div>
  </section>`;
}

function groupTimelineByEmployer(items) {
  const groups = [];
  for (const item of items) {
    const employer = item.company || 'Group name';
    let group = groups.find(g => g.company === employer);
    if (!group) { group = { company: employer, items: [] }; groups.push(group); }
    group.items.push(item);
  }
  return groups;
}

function employerCard(group) {
  const range = employerRange(group.items);
  const summary = group.items.find(it => it.company_summary)?.company_summary || '';
  return `
  <article class="company">
    <header class="company-head">
      <div><h3>${escHtml(group.company)}</h3>${summary ? `<p>${escHtml(summary)}</p>` : ''}</div>
      ${range ? `<div class="company-period">${escHtml(range)}</div>` : ''}
    </header>
    <div class="role-stack">${group.items.map((it, index) => timelineItem(it, index)).join('')}</div>
  </article>`;
}

function employerRange(items) {
  const starts = items.map(it => it.start_date).filter(Boolean);
  const ends = items.map(it => it.end_date).filter(Boolean);
  if (!starts.length && !ends.length) return '';
  const start = starts[starts.length - 1] || '';
  const end = ends[0] || '';
  return [start, end].filter(Boolean).join(' – ');
}

function timelineItem(it, index = 0) {
  const period = [it.start_date, it.end_date].filter(Boolean).join(' – ') || '';
  const tags = Array.isArray(it.tags) ? it.tags : String(it.tags || '').split(',').map(s => s.trim()).filter(Boolean);
  const roleClass = index === 0 ? 'role-step current' : 'role-step';
  return `
  <section class="${roleClass}">
    <div class="role-date">${escHtml(period || (index === 0 ? 'Current' : 'Previous'))}</div>
    <div class="role-content">
      ${it.role ? `<h4>${escHtml(it.role)}</h4>` : ''}
      ${it.description ? formatTimelineDescription(it.description) : ''}
      ${tags.length ? `<div class="tags">${tags.map(tag => `<span class="tag">${escHtml(tag)}</span>`).join('')}</div>` : ''}
    </div>
  </section>`;
}

function formatTimelineDescription(description) {
  const text = String(description || '').trim();
  if (!text) return '';
  const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
  const bullets = lines.filter(line => /^[-*•]\s+/.test(line)).map(line => line.replace(/^[-*•]\s+/, ''));
  if (bullets.length && bullets.length === lines.length) return `<ul>${bullets.map(line => `<li>${escHtml(line)}</li>`).join('')}</ul>`;
  return lines.map(line => `<p>${escHtml(line.replace(/^[-*•]\s+/, ''))}</p>`).join('');
}

// ── Contact
function renderContact(c, sectionId = 'contact') {
  const title = c.title || 'Referee enquiry.';
  const kicker = c.kicker || '04 / contact';
  const refereeTitle = c.referee_title || 'Referees available on request.';
  const refereeSummary = c.referee_summary || 'For privacy, referee details are not published directly. Send the role, company, hiring stage, and what you need confirmed.';
  const tagList = Array.isArray(c.referee_tags)
    ? c.referee_tags
    : String(c.referee_tags || 'private by default, professional, on request').split(',').map(s => s.trim()).filter(Boolean);
  const mailTarget = c.enquiry_email || c.email || '';
  const action = mailTarget ? `mailto:${mailTarget}` : 'mailto:';

  return `
  <section class="section wrap" id="${escAttr(sectionId)}">
    ${renderSectionHeading(kicker, title)}
    <div class="referee">
      <div class="form-card">
        <h3>${escHtml(refereeTitle)}</h3>
        <p>${escHtml(refereeSummary)}</p>
        ${tagList.length ? `<div class="tags">${tagList.map(tag => `<span class="tag">${escHtml(tag)}</span>`).join('')}</div>` : ''}
      </div>
      <form class="form-card" action="${escAttr(action)}" method="post" enctype="text/plain">
        <label>Name<input name="name" autocomplete="name" required></label>
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <label>Organisation<input name="organisation"></label>
        <label>Enquiry type<select name="type"><option>Request referees</option><option>Confirm experience</option><option>Discuss role</option><option>Other</option></select></label>
        <label>Message<textarea name="message" placeholder="Role title, company, hiring stage, and preferred next step." required></textarea></label>
        <button class="stamp primary" type="submit">Prepare email</button>
      </form>
    </div>
  </section>`;
}

// ── Icon helpers
function emailIcon() { return `<svg class="w-5 h-5" style="color:var(--brand)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>`; }
function githubIcon() { return `<svg class="w-5 h-5" style="color:var(--brand)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 00-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0020 4.77 5.07 5.07 0 0019.91 1S18.73.65 16 2.48a13.38 13.38 0 00-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 005 4.77a5.44 5.44 0 00-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 009 18.13V22"/></svg>`; }
function linkedinIcon() { return `<svg class="w-5 h-5" style="color:var(--brand)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8a6 6 0 016 6v7h-4v-7a2 2 0 00-2-2 2 2 0 00-2 2v7h-4v-7a6 6 0 016-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>`; }
function globeIcon() { return `<svg class="w-5 h-5" style="color:var(--brand)" fill="none" stroke="currentColor" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/></svg>`; }

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function escHtml(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  return String(s||'').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// ═══════════════════════════════════════════════════════
//  BOOT
// ═══════════════════════════════════════════════════════
init();
</script>
