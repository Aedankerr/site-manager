<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<meta name="description" content="">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Site CSS with optional external IBM Plex fonts for the technical dossier theme */
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  :root { --brand: #6366f1; --brand-dark: #4f46e5; }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', system-ui, sans-serif; background:#fff; color:#111827; line-height:1.6; -webkit-font-smoothing:antialiased; }
  img { max-width:100%; display:block; }
  a { color:inherit; text-decoration:none; }

  /* Layout */
  .max-w-5xl { max-width:64rem; margin-left:auto; margin-right:auto; }
  .max-w-3xl { max-width:48rem; margin-left:auto; margin-right:auto; }
  .px-6 { padding-left:1.5rem; padding-right:1.5rem; }
  .py-4 { padding-top:1rem; padding-bottom:1rem; }
  .py-8 { padding-top:2rem; padding-bottom:2rem; }
  .py-16 { padding-top:4rem; padding-bottom:4rem; }
  .py-24 { padding-top:6rem; padding-bottom:6rem; }
  .py-32 { padding-top:8rem; padding-bottom:8rem; }
  .py-1\.5 { padding-top:.375rem; padding-bottom:.375rem; }
  .mt-2 { margin-top:.5rem; }
  .mt-16 { margin-top:4rem; }
  .mb-1 { margin-bottom:.25rem; }
  .mb-2 { margin-bottom:.5rem; }
  .mb-4 { margin-bottom:1rem; }
  .mb-10 { margin-bottom:2.5rem; }

  /* Flex */
  .flex { display:flex; }
  .items-center { align-items:center; }
  .items-baseline { align-items:baseline; }
  .justify-between { justify-content:space-between; }
  .flex-wrap { flex-wrap:wrap; }
  .gap-1 { gap:.25rem; }
  .gap-1\.5 { gap:.375rem; }
  .gap-3 { gap:.75rem; }
  .gap-4 { gap:1rem; }
  .gap-6 { gap:1.5rem; }
  .gap-x-3 { column-gap:.75rem; }
  .gap-y-1 { row-gap:.25rem; }
  .min-w-0 { min-width:0; }
  .flex-shrink-0 { flex-shrink:0; }
  .flex-1 { flex:1 1 0%; }
  .hidden { display:none; }

  /* Grid */
  .grid { display:grid; }

  /* Text */
  .text-xs { font-size:.75rem; line-height:1rem; }
  .text-sm { font-size:.875rem; line-height:1.25rem; }
  .text-base { font-size:1rem; line-height:1.5rem; }
  .text-lg { font-size:1.125rem; line-height:1.75rem; }
  .text-xl { font-size:1.25rem; line-height:1.75rem; }
  .text-3xl { font-size:1.875rem; line-height:2.25rem; }
  .text-4xl { font-size:2.25rem; line-height:2.5rem; }
  .font-medium { font-weight:500; }
  .font-semibold { font-weight:600; }
  .font-bold { font-weight:700; }
  .leading-tight { line-height:1.25; }
  .leading-relaxed { line-height:1.625; }
  .truncate { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .line-clamp-3 { display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .tracking-tight { letter-spacing:-.025em; }
  .uppercase { text-transform:uppercase; }

  /* Colors */
  .text-gray-400 { color:#9ca3af; }
  .text-gray-500 { color:#6b7280; }
  .text-gray-600 { color:#4b5563; }
  .text-gray-700 { color:#374151; }
  .text-white { color:#fff; }
  .text-indigo-300 { color:#a5b4fc; }
  .text-indigo-600 { color:#4f46e5; }
  .bg-white { background:#fff; }
  .bg-gray-100 { background:#f3f4f6; }
  .bg-indigo-100 { background:#e0e7ff; }
  .bg-indigo-50 { background:#eef2ff; }
  .bg-purple-100 { background:#f3e8ff; }

  /* Border */
  .border { border-width:1px; }
  .border-t { border-top-width:1px; }
  .border-b { border-bottom-width:1px; }
  .border-gray-100 { border-color:#f3f4f6; }
  .rounded-xl { border-radius:.75rem; }
  .rounded-2xl { border-radius:1rem; }
  .rounded-full { border-radius:9999px; }
  .overflow-hidden { overflow:hidden; }

  /* Shadow */
  .shadow-sm { box-shadow:0 1px 2px 0 rgba(0,0,0,.05); }
  .shadow-lg { box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1); }

  /* Position */
  .sticky { position:sticky; }
  .relative { position:relative; }
  .absolute { position:absolute; }
  .inset-0 { inset:0; }
  .top-0 { top:0; }
  .z-50 { z-index:50; }
  .left-\[-7px\] { left:-7px; }
  .top-1\.5 { top:.375rem; }

  /* Size */
  .w-3 { width:.75rem; }
  .h-3 { height:.75rem; }
  .w-3\.5 { width:.875rem; }
  .h-3\.5 { height:.875rem; }
  .w-5 { width:1.25rem; }
  .h-5 { height:1.25rem; }
  .w-6 { width:1.5rem; }
  .h-6 { height:1.5rem; }
  .w-8 { width:2rem; }
  .h-8 { height:2rem; }
  .w-10 { width:2.5rem; }
  .h-10 { height:2.5rem; }
  .w-full { width:100%; }
  .h-44 { height:11rem; }
  .h-1 { height:.25rem; }
  .min-h-screen { min-height:100vh; }
  .min-h-\[420px\] { min-height:420px; }

  /* Object */
  .object-cover { object-fit:cover; }

  /* Animation */
  .animate-spin { animation:spin 1s linear infinite; }
  @keyframes spin{to{transform:rotate(360deg)}}
  .animate-ping { animation:ping 1s cubic-bezier(0,0,.2,1) infinite; }
  @keyframes ping{75%,100%{transform:scale(2);opacity:0}}

  /* Backdrop */
  .backdrop-blur-md { backdrop-filter:blur(12px); }

  /* Misc */
  .cursor-pointer { cursor:pointer; }
  .pointer-events-none { pointer-events:none; }
  .select-none { user-select:none; }
  .opacity-75 { opacity:.75; }
  .border-2 { border-width:2px; }
  .border-indigo-100 { border-color:#e0e7ff; }
  .pl-8 { padding-left:2rem; }

  /* Navbar */
  nav { background:rgba(255,255,255,.92); border-bottom:1px solid #f3f4f6; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  nav .brand { font-weight:700; font-size:1.125rem; letter-spacing:-.025em; color:var(--brand); }
  nav .nav-links { display:none; gap:1.5rem; font-size:.875rem; font-weight:500; color:#4b5563; }
  nav .nav-links a { transition:color .15s; }
  nav .nav-links a:hover, nav .nav-links a.active { color:var(--brand); }
  nav .mobile-btn { background:none; border:none; cursor:pointer; padding:.25rem; }
  .mobile-menu { border-top:1px solid #f3f4f6; }
  .mobile-menu a { display:block; padding:.375rem 0; font-size:.875rem; font-weight:500; color:#374151; }
  .mobile-menu a:hover { color:var(--brand); }
  @media(min-width:768px){
    nav .nav-links { display:flex; }
    nav .mobile-btn { display:none; }
    .grid-2col { grid-template-columns:repeat(2,1fr); }
    .grid-3col { grid-template-columns:repeat(3,1fr); }
    .text-md-xl { font-size:1.25rem; }
    .text-md-5xl { font-size:3rem; line-height:1; }
  }

  /* Timeline component */
  .timeline-item { position:relative; padding-left:2rem; border-left:2px solid #e0e7ff; }
  .timeline-dot { width:.75rem; height:.75rem; border-radius:50%; background:var(--brand); position:absolute; left:-.4375rem; top:.375rem; }
  .timeline-role { font-weight:600; font-size:1rem; }
  .timeline-company { font-size:.875rem; font-weight:500; color:var(--brand); }
  .timeline-date { font-size:.75rem; color:#9ca3af; margin:.25rem 0 .5rem; }
  .timeline-desc { font-size:.875rem; color:#4b5563; }
  .space-y-10 > * + * { margin-top:2.5rem; }

  /* Hero */
  .hero { position:relative; min-height:420px; display:flex; align-items:center; background:linear-gradient(135deg,#eef2ff 0%,#fff 100%); }
  .hero.has-bg { background-size:cover; background-position:center; }
  .hero.has-bg::before { content:''; position:absolute; inset:0; background:rgba(0,0,0,.45); }
  .hero-content { position:relative; z-index:1; }
  .hero-title { font-size:2.25rem; font-weight:700; line-height:1.2; margin-bottom:1rem; }
  .hero-subtitle { font-size:1.125rem; margin-bottom:2rem; max-width:36rem; }
  .hero.has-bg .hero-title, .hero.has-bg .hero-subtitle { color:#fff; }
  .hero.has-bg .hero-subtitle { color:rgba(255,255,255,.82); }
  .btn-primary { display:inline-flex; align-items:center; gap:.5rem; padding:.75rem 1.5rem; border-radius:.75rem; font-weight:600; color:#fff; background:var(--brand); box-shadow:0 4px 14px rgba(99,102,241,.35); transition:transform .2s,box-shadow .2s; }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 8px 20px rgba(99,102,241,.4); }
  @media(min-width:768px){ .hero-title { font-size:3rem; } .hero-subtitle { font-size:1.25rem; } }

  /* Section heading */
  .section-heading { font-size:1.875rem; font-weight:700; margin-bottom:.5rem; }
  .section-bar { width:3rem; height:.25rem; border-radius:9999px; background:var(--brand); margin-bottom:2.5rem; }

  /* Project card */
  .proj-card { background:#fff; border:1px solid #f3f4f6; border-radius:1rem; overflow:hidden; box-shadow:0 1px 2px rgba(0,0,0,.05); transition:transform .2s,box-shadow .2s; }
  .proj-card:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.10); }
  .proj-placeholder { width:100%; height:11rem; background:linear-gradient(135deg,#e0e7ff,#f3e8ff); display:flex; align-items:center; justify-content:center; }
  .proj-body { padding:1.25rem; }
  .proj-name { font-weight:600; font-size:1.125rem; margin-bottom:.5rem; }
  .proj-desc { font-size:.875rem; color:#6b7280; margin-bottom:1rem; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; overflow:hidden; }
  .tech-pills { display:flex; flex-wrap:wrap; gap:.375rem; margin-bottom:1rem; }
  .tech-pill { display:inline-block; padding:.125rem .625rem; border-radius:9999px; font-size:.7rem; font-weight:500; background:#e0e7ff; color:#4338ca; }
  .proj-link { display:inline-flex; align-items:center; gap:.25rem; font-size:.875rem; font-weight:500; color:var(--brand); }
  .grid-projects { display:grid; gap:1.5rem; grid-template-columns:1fr; }
  @media(min-width:640px){ .grid-projects { grid-template-columns:repeat(2,1fr); } }
  @media(min-width:1024px){ .grid-projects { grid-template-columns:repeat(3,1fr); } }

  /* Contact */
  .contact-grid { display:grid; gap:1rem; grid-template-columns:1fr; }
  @media(min-width:640px){ .contact-grid { grid-template-columns:repeat(2,1fr); } }
  .contact-card { display:flex; align-items:center; gap:.75rem; padding:1rem; border-radius:.75rem; background:#f8fafc; transition:background .15s,transform .15s; }
  .contact-card:hover { background:#eef2ff; transform:translateY(-2px); }
  .contact-icon { width:2.5rem; height:2.5rem; border-radius:.75rem; display:flex; align-items:center; justify-content:center; flex-shrink:0; background:#eef2ff; }
  .contact-label { font-size:.75rem; font-weight:500; color:#9ca3af; }
  .contact-value { font-size:.875rem; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* Footer */
  footer { border-top:1px solid #f3f4f6; padding:2rem 0; margin-top:4rem; }
  footer p { text-align:center; font-size:.875rem; color:#9ca3af; }

  /* Loading spinner */
  .spinner { display:flex; align-items:center; justify-content:center; padding:8rem 0; }
  .spinner div { width:2rem; height:2rem; border:2px solid var(--brand); border-top-color:transparent; border-radius:50%; animation:spin 1s linear infinite; }

  /* Empty page shell: keeps fresh installs styled without seeded demo content */
  .empty-page-shell { min-height:420px; display:flex; align-items:center; background:linear-gradient(135deg,#eef2ff 0%,#fff 100%); }
  .empty-page-card { max-width:42rem; margin:0 auto; padding:2rem; border:1px solid #e0e7ff; border-radius:1.5rem; background:rgba(255,255,255,.86); box-shadow:0 20px 45px rgba(79,70,229,.10); text-align:center; }
  .empty-page-kicker { display:inline-flex; align-items:center; gap:.5rem; margin-bottom:1rem; padding:.35rem .75rem; border-radius:9999px; background:#e0e7ff; color:#4338ca; font-size:.75rem; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  .empty-page-title { font-size:2rem; line-height:1.15; font-weight:700; letter-spacing:-.025em; color:#111827; margin-bottom:.75rem; }
  .empty-page-text { color:#6b7280; font-size:1rem; line-height:1.7; max-width:34rem; margin:0 auto; }

  /* Built-in theme: Technical dossier style from the attached resume layout */
  body.theme-github-pages-dossier {
    --brand:#050505;
    --brand-dark:#050505;
    --paper:#f4f3ee;
    --ink:#050505;
    --muted:#595959;
    --soft:#deddd7;
    --rule:rgba(5,5,5,.16);
    --rule-strong:rgba(5,5,5,.34);
    --white:#fbfaf6;
    --grid-rgb:5,5,5;
    --paper-rgb:244,243,238;
    --white-rgb:251,250,246;
    --text-soft:#30302c;
    background:
      linear-gradient(90deg, rgba(var(--grid-rgb),.04) 1px, transparent 1px) 0 0 / 32px 32px,
      linear-gradient(rgba(var(--grid-rgb),.03) 1px, transparent 1px) 0 0 / 32px 32px,
      var(--paper);
    color:var(--ink);
    font-family:"IBM Plex Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    letter-spacing:-.006em;
  }
  body.theme-github-pages-dossier nav,
  body.theme-github-pages-dossier footer {
    border-color:var(--ink);
    border-width:2px;
    background:rgba(var(--paper-rgb),.92);
    box-shadow:none;
    backdrop-filter:blur(10px);
  }
  body.theme-github-pages-dossier #siteName {
    color:var(--ink) !important;
    font-weight:800;
    letter-spacing:-.04em;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .nav-link {
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size:12px;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .nav-link.active,
  body.theme-github-pages-dossier .nav-link:hover {
    color:var(--ink);
    text-decoration:underline;
    text-decoration-thickness:2px;
    text-underline-offset:5px;
  }
  body.theme-github-pages-dossier .hero,
  body.theme-github-pages-dossier .empty-page-shell {
    background:transparent;
    border-bottom:2px solid var(--ink);
    min-height:390px;
  }
  body.theme-github-pages-dossier .hero > .max-w-5xl,
  body.theme-github-pages-dossier .empty-page-card {
    border:2px solid var(--ink);
    background:rgba(var(--white-rgb),.92);
    box-shadow:0 10px 26px rgba(var(--grid-rgb),.10);
  }
  body.theme-github-pages-dossier .hero > .max-w-5xl { padding:clamp(22px,3vw,34px); }
  body.theme-github-pages-dossier .hero-title,
  body.theme-github-pages-dossier .empty-page-title {
    font-size:clamp(34px,4.8vw,64px);
    line-height:.92;
    letter-spacing:-.055em;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .hero-subtitle,
  body.theme-github-pages-dossier .empty-page-text,
  body.theme-github-pages-dossier .proj-desc {
    color:var(--text-soft);
  }
  body.theme-github-pages-dossier .section-heading {
    border-bottom:2px solid var(--ink);
    padding-bottom:10px;
    letter-spacing:-.045em;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .section-bar { display:none; }
  body.theme-github-pages-dossier .btn-primary,
  body.theme-github-pages-dossier .proj-link {
    border:2px solid var(--ink);
    background:var(--ink);
    color:var(--paper);
    border-radius:0;
    box-shadow:4px 4px 0 var(--ink);
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size:12px;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .btn-primary:hover,
  body.theme-github-pages-dossier .proj-link:hover { transform:translate(1px,1px); box-shadow:3px 3px 0 var(--ink); }
  body.theme-github-pages-dossier .proj-card,
  body.theme-github-pages-dossier .contact-card {
    background:rgba(var(--white-rgb),.72);
    border:2px solid var(--ink);
    border-radius:0;
    box-shadow:none;
  }
  body.theme-github-pages-dossier .proj-card:hover,
  body.theme-github-pages-dossier .contact-card:hover { transform:translateY(-2px); box-shadow:0 10px 26px rgba(var(--grid-rgb),.10); background:rgba(var(--white-rgb),.92); }
  body.theme-github-pages-dossier .proj-placeholder { background:repeating-linear-gradient(-45deg, rgba(var(--grid-rgb),.05), rgba(var(--grid-rgb),.05) 8px, transparent 8px, transparent 16px); }
  body.theme-github-pages-dossier .tech-pill,
  body.theme-github-pages-dossier .empty-page-kicker {
    border:1px solid var(--rule-strong);
    background:var(--paper);
    color:var(--ink);
    border-radius:0;
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .section.wrap {
    max-width:1100px;
    margin:0 auto;
    padding:clamp(48px,8vw,96px) 24px;
  }
  body.theme-github-pages-dossier .section-title {
    display:grid;
    grid-template-columns:minmax(140px,220px) 1fr;
    gap:clamp(18px,4vw,48px);
    align-items:end;
    border-bottom:2px solid var(--ink);
    padding-bottom:18px;
    margin-bottom:24px;
  }
  body.theme-github-pages-dossier .section-title code,
  body.theme-github-pages-dossier .form-card label {
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size:12px;
    letter-spacing:.08em;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .section-title code { color:var(--muted); }
  body.theme-github-pages-dossier .section-title h2 {
    font-size:clamp(34px,5vw,72px);
    line-height:.92;
    letter-spacing:-.06em;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .referee {
    display:grid;
    grid-template-columns:minmax(0,.9fr) minmax(280px,1.1fr);
    gap:18px;
    align-items:stretch;
  }
  body.theme-github-pages-dossier .form-card {
    background:rgba(var(--white-rgb),.84);
    border:2px solid var(--ink);
    padding:clamp(18px,3vw,28px);
    box-shadow:0 10px 26px rgba(var(--grid-rgb),.10);
  }
  body.theme-github-pages-dossier .form-card h3 {
    font-size:clamp(24px,3vw,40px);
    line-height:1;
    letter-spacing:-.045em;
    text-transform:uppercase;
    margin-bottom:14px;
  }
  body.theme-github-pages-dossier .form-card p {
    color:var(--text-soft);
    line-height:1.7;
    margin-bottom:18px;
  }
  body.theme-github-pages-dossier .tags { display:flex; flex-wrap:wrap; gap:8px; }
  body.theme-github-pages-dossier .tag {
    display:inline-flex;
    border:1px solid var(--rule-strong);
    background:var(--paper);
    color:var(--ink);
    padding:5px 9px;
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size:11px;
    text-transform:uppercase;
  }
  body.theme-github-pages-dossier .form-card form,
  body.theme-github-pages-dossier form.form-card { display:grid; gap:12px; }
  body.theme-github-pages-dossier .form-card label { display:grid; gap:7px; color:var(--muted); }
  body.theme-github-pages-dossier .form-card input,
  body.theme-github-pages-dossier .form-card select,
  body.theme-github-pages-dossier .form-card textarea {
    width:100%;
    border:1px solid var(--rule-strong);
    background:rgba(var(--paper-rgb),.58);
    color:var(--ink);
    padding:11px 12px;
    font:14px/1.45 "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    border-radius:0;
  }
  body.theme-github-pages-dossier .form-card textarea { min-height:118px; resize:vertical; }
  body.theme-github-pages-dossier .form-card input:focus,
  body.theme-github-pages-dossier .form-card select:focus,
  body.theme-github-pages-dossier .form-card textarea:focus {
    outline:none;
    border-color:var(--ink);
    box-shadow:0 0 0 2px rgba(var(--grid-rgb),.10);
  }
  body.theme-github-pages-dossier .employment-section {
    display:grid;
    grid-template-columns:160px minmax(0,1fr);
    gap:clamp(20px,4vw,40px);
  }
  body.theme-github-pages-dossier .employment-section .section-title {
    grid-column:1 / -1;
    margin-bottom:0;
  }
  body.theme-github-pages-dossier .employment-sidebar {
    font-family:"IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-size:11px;
    line-height:1.7;
    letter-spacing:.03em;
    text-transform:uppercase;
    color:var(--muted);
  }
  body.theme-github-pages-dossier .employer-stack { display:grid; gap:12px; }
  body.theme-github-pages-dossier .employer-card {
    border:2px solid var(--ink);
    background:rgba(var(--white-rgb),.72);

  @media(max-width:860px){

<body class="bg-white text-gray-900 antialiased">

<!-- ── Navbar ──────────────────────────────────────────── -->
<nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100 shadow-sm">
  <div class="max-w-5xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/" class="font-bold text-lg tracking-tight" style="color:var(--brand)" id="siteName">Site</a>
    <div class="hidden md:flex items-center gap-6 text-sm font-medium text-gray-600" id="navLinks"></div>
    <!-- Mobile menu -->
    <button class="md:hidden p-1" onclick="toggleMobileMenu()">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </div>
  <div id="mobileMenu" class="hidden md:hidden border-t border-gray-100 px-6 py-3 space-y-2"></div>
</nav>

<!-- ── Page content ────────────────────────────────────── -->
<main id="pageContent" class="min-h-screen"></main>

<!-- ── Footer ──────────────────────────────────────────── -->
<footer class="border-t border-gray-100 py-8 mt-16">
  <div class="max-w-5xl mx-auto px-6 text-center text-sm text-gray-400" id="footerText">
    Built with Site Manager
  </div>
</footer>

<script>
// ═══════════════════════════════════════════════════════
//  ROUTER
// ═══════════════════════════════════════════════════════
const routes = {
  '/':          'home',
  '/projects':  'projects',
  '/cv':        'cv',
  '/contacts':  'contacts',
};

// Figure out which slug to load from the URL path
function getSlug() {
  const path = window.location.pathname.replace(/\/$/, '') || '/';
  return routes[path] || 'home';
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
async function init() {
  // Load pages for nav
  let pages = [];
  try { pages = await fetch('/api/pages').then(r => r.json()); } catch {}

  // Set site name from settings
  try {
    const settings = await fetch('/api/site').then(r => r.json());
    if (settings.site_name) {
      document.getElementById('siteName').textContent = settings.site_name;
      document.title = settings.site_name;
    }
    if (settings.site_description) {
      document.querySelector('meta[name="description"]').content = settings.site_description;
    }
    applySiteTheme(settings.site_theme || 'default');
  } catch {}

  // Build nav
  buildNav(pages);

  // Apply user custom CSS after built-in theme CSS so it remains the final override layer.
  await applyCustomCss();

  // Load page blocks
  const slug = getSlug();
  await loadPage(slug);
}

function applySiteTheme(theme) {
  const allowed = ['default', 'github-pages-dossier'];
  if (!allowed.includes(theme)) theme = 'default';
  document.body.classList.remove(...allowed.map(t => `theme-${t}`));
  if (theme !== 'default') document.body.classList.add(`theme-${theme}`);
}

async function applyCustomCss() {
  try {
    const settings = await fetch('/api/settings').then(r => r.json());
    const css = String(settings.customCss || '').replace(/<\/style>/gi, '');
    let style = document.getElementById('custom-css');
    if (!css) { if (style) style.remove(); return; }
    if (!style) {
      style = document.createElement('style');
      style.id = 'custom-css';
      document.head.appendChild(style);
    }
    style.textContent = css;
  } catch {}
}

function buildNav(pages) {
  const slugToPath = { home: '/', projects: '/projects', cv: '/cv', contacts: '/contacts' };
  const currentSlug = getSlug();
  const html = pages.map(p => {
    const href = slugToPath[p.slug] || ('/' + p.slug);
    const active = p.slug === currentSlug ? 'active' : '';
    return `<a href="${href}" class="nav-link ${active}">${escHtml(p.title)}</a>`;
  }).join('');
  document.getElementById('navLinks').innerHTML = html;
  document.getElementById('mobileMenu').innerHTML = pages.map(p => {
    const href = slugToPath[p.slug] || ('/' + p.slug);
    return `<a href="${href}" class="block py-1.5 text-sm font-medium text-gray-700 hover:text-indigo-600">${escHtml(p.title)}</a>`;
  }).join('');
}

function toggleMobileMenu() {
  document.getElementById('mobileMenu').classList.toggle('hidden');
}

async function loadPage(slug) {
  const content = document.getElementById('pageContent');
  content.innerHTML = '<div class="flex items-center justify-center py-32"><div class="w-8 h-8 border-2 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>';
  try {
    const blocks = await fetch(`/api/pages/${slug}/blocks`).then(r => r.json());
    if (!blocks.length) {
      content.innerHTML = renderEmptyPage(slug);
      return;
    }
    content.innerHTML = blocks.map(b => renderBlock(b)).join('');
    // Trigger animations
    content.querySelectorAll('.fade-up').forEach((el, i) => {
      el.style.animationDelay = (i * 0.08) + 's';
    });
  } catch (err) {
    content.innerHTML = '<div class="max-w-2xl mx-auto px-6 py-32 text-center text-gray-400">Failed to load content.</div>';
  }
}

function renderEmptyPage(slug) {
  const pageName = ({ home: 'Home', projects: 'Projects', cv: 'CV', contacts: 'Contact' }[slug]) || 'Page';
  return `
  <section class="empty-page-shell px-6 py-24 fade-up">
    <div class="empty-page-card">
      <div class="empty-page-kicker">${escHtml(pageName)}</div>
      <h1 class="empty-page-title">Start building this page</h1>
      <p class="empty-page-text">This page is intentionally empty on a fresh install. Open the admin interface, add sections, and publish your own content when you are ready.</p>
    </div>
  </section>`;
}

// ═══════════════════════════════════════════════════════
//  BLOCK RENDERERS
// ═══════════════════════════════════════════════════════
function renderBlock(block) {
  const c = block.content || {};
  switch (block.type) {
    case 'hero':         return renderHero(c);
    case 'projects_grid': return renderProjectsGrid(c);
    case 'timeline':     return renderTimeline(c);
    case 'contact':      return renderContact(c);
    default:             return '';
  }
}

// ── Hero
function renderHero(c) {
  const hasBg = !!c.background_image;
  const bgStyle = hasBg ? `style="background-image:url('${escAttr(c.background_image)}')"` : '';
  const textColor = hasBg ? 'text-white' : 'text-gray-900';
  const subColor = hasBg ? 'text-white/80' : 'text-gray-500';

  return `
  <section class="relative ${hasBg ? 'hero-bg' : 'bg-gradient-to-br from-indigo-50 to-white'} min-h-[420px] flex items-center" ${bgStyle}>
    <div class="relative z-10 max-w-5xl mx-auto px-6 py-24 fade-up">
      ${c.title ? `<h1 class="text-4xl md:text-5xl font-bold leading-tight mb-4 ${textColor}">${escHtml(c.title)}</h1>` : ''}
      ${c.subtitle ? `<p class="text-lg md:text-xl mb-8 max-w-xl ${subColor}">${escHtml(c.subtitle)}</p>` : ''}
      ${c.primary_button_text ? `<a href="${escAttr(c.primary_button_link || '#')}" class="inline-flex items-center gap-2 px-6 py-3 rounded-xl font-semibold text-white shadow-lg transition-all hover:scale-105 hover:shadow-xl" style="background:var(--brand)">${escHtml(c.primary_button_text)}</a>` : ''}
    </div>
  </section>`;
}

// ── Projects Grid
function renderProjectsGrid(c) {
  const projects = c.projects || [];
  return `
  <section class="max-w-5xl mx-auto px-6 py-16 fade-up">
    ${c.title ? `<h2 class="text-3xl font-bold mb-2">${escHtml(c.title)}</h2><div class="w-12 h-1 rounded-full mb-10" style="background:var(--brand)"></div>` : ''}
    <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-6">
      ${projects.map(p => projectCard(p)).join('')}
    </div>
  </section>`;
}

function projectCard(p) {
  const techList = Array.isArray(p.tech_stack) ? p.tech_stack : (p.tech_stack || '').split(',').map(s => s.trim()).filter(Boolean);
  return `
  <div class="proj-card bg-white border border-gray-100 rounded-2xl overflow-hidden shadow-sm">
    ${p.image ? `<img src="${escAttr(p.image)}" alt="${escAttr(p.name||'')}" class="w-full h-44 object-cover">` : `<div class="w-full h-44 bg-gradient-to-br from-indigo-100 to-purple-100 flex items-center justify-center"><svg class="w-10 h-10 text-indigo-300" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/></svg></div>`}
    <div class="p-5">
      <h3 class="font-semibold text-lg mb-2">${escHtml(p.name||'Untitled')}</h3>
      ${p.description ? `<p class="text-sm text-gray-500 mb-4 line-clamp-3">${escHtml(p.description)}</p>` : ''}
      ${techList.length ? `<div class="flex flex-wrap gap-1.5 mb-4">${techList.map(t => `<span class="tech-pill">${escHtml(t)}</span>`).join('')}</div>` : ''}
      ${p.link ? `<a href="${escAttr(p.link)}" target="_blank" rel="noopener" class="inline-flex items-center gap-1 text-sm font-medium" style="color:var(--brand)">View Project <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg></a>` : ''}
    </div>
  </div>`;
}

// ── Timeline
function renderTimeline(c) {
  const items = c.items || [];
  const title = c.title || 'Employment History';
  const kicker = c.kicker || '01 / real work';
  const sidebar = c.sidebar || 'Grouped by employer so promotions and acting roles read as progression instead of separate disconnected jobs.';
  const groups = groupTimelineByEmployer(items);
  return `
  <section class="section wrap employment-section fade-up">
    <div class="section-title"><code>${escHtml(kicker)}</code><h2>${escHtml(title)}</h2></div>
    <aside class="employment-sidebar">${escHtml(sidebar)}</aside>
    <div class="employer-stack">
      ${groups.map(group => employerCard(group)).join('')}
    </div>
  </section>`;
}

function groupTimelineByEmployer(items) {
  const groups = [];
  for (const item of items) {
    const employer = item.company || 'Organisation';
    let group = groups.find(g => g.company === employer);
    if (!group) {
      group = { company: employer, items: [] };
      groups.push(group);
    }
    group.items.push(item);
  }
  return groups;
}

function employerCard(group) {
  const range = employerRange(group.items);
  const summary = group.items.find(it => it.company_summary)?.company_summary || '';
  return `
  <article class="employer-card">
    <header class="employer-head">
      <div>
        <h3>${escHtml(group.company)}</h3>
        ${summary ? `<p class="employer-summary">${escHtml(summary)}</p>` : ''}
      </div>
      ${range ? `<span class="employer-range">${escHtml(range)}</span>` : ''}
    </header>
    <div class="role-list">
      ${group.items.map((it, index) => timelineItem(it, index)).join('')}
    </div>
  </article>`;
}

function employerRange(items) {
  const starts = items.map(it => it.start_date).filter(Boolean);
  const ends = items.map(it => it.end_date).filter(Boolean);
  if (!starts.length && !ends.length) return '';
  const start = starts[starts.length - 1] || '';
  const end = ends[0] || '';
  return [start, end].filter(Boolean).join(' – ');
}

function timelineItem(it, index = 0) {
  const period = [it.start_date, it.end_date].filter(Boolean).join(' – ') || '';
  const tags = Array.isArray(it.tags)
    ? it.tags
    : String(it.tags || '').split(',').map(s => s.trim()).filter(Boolean);
  return `
  <div class="role-row${index === 0 ? ' current-role' : ''}">
    <div class="role-date">${escHtml(period)}</div>
    <div class="role-rail"><span class="role-marker"></span></div>
    <div class="role-body">
      ${it.role ? `<h3 class="role-title">${escHtml(it.role)}</h3>` : ''}
      ${it.description ? `<div class="role-desc">${formatTimelineDescription(it.description)}</div>` : ''}
      ${tags.length ? `<div class="timeline-tags">${tags.map(tag => `<span class="timeline-tag">${escHtml(tag)}</span>`).join('')}</div>` : ''}
    </div>
  </div>`;
}

function formatTimelineDescription(description) {
  const text = String(description || '').trim();
  if (!text) return '';
  const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
  const bullets = lines.filter(line => /^[-*•]\s+/.test(line)).map(line => line.replace(/^[-*•]\s+/, ''));
  if (bullets.length && bullets.length === lines.length) {
    return `<ul>${bullets.map(line => `<li>${escHtml(line)}</li>`).join('')}</ul>`;
  }
  return lines.map(line => `<p>${escHtml(line.replace(/^[-*•]\s+/, ''))}</p>`).join('');
}

// ── Contact
function renderContact(c) {
  const title = c.title || 'Referee enquiry.';
  const kicker = c.kicker || '04 / contact';
  const refereeTitle = c.referee_title || 'Referees available on request.';
  const refereeSummary = c.referee_summary || 'For privacy, referee details are not published directly. Send the role, company, hiring stage, and what you need confirmed.';
  const tagList = Array.isArray(c.referee_tags)
    ? c.referee_tags
    : String(c.referee_tags || 'private by default, professional, on request').split(',').map(s => s.trim()).filter(Boolean);
  const mailTarget = c.enquiry_email || c.email || '';
  const action = mailTarget ? `mailto:${mailTarget}` : 'mailto:';

  return `
  <section class="section wrap" id="referees">
    <div class="section-title"><code>${escHtml(kicker)}</code><h2>${escHtml(title)}</h2></div>
    <div class="referee">
      <div class="form-card">
        <h3>${escHtml(refereeTitle)}</h3>
        <p>${escHtml(refereeSummary)}</p>
        ${tagList.length ? `<div class="tags">${tagList.map(tag => `<span class="tag">${escHtml(tag)}</span>`).join('')}</div>` : ''}
      </div>
      <form class="form-card" action="${escAttr(action)}" method="post" enctype="text/plain">
        <label>Name<input name="name" autocomplete="name" required></label>
        <label>Email<input type="email" name="email" autocomplete="email" required></label>
        <label>Organisation<input name="organisation"></label>
        <label>Enquiry type<select name="type"><option>Request referees</option><option>Confirm experience</option><option>Discuss role</option><option>Other</option></select></label>
        <label>Message<textarea name="message" placeholder="Role title, company, hiring stage, and preferred next step." required></textarea></label>
        <button class="stamp primary" type="submit">Prepare email</button>
      </form>
    </div>
  </section>`;
}
