name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run frontend tests
        run: node --test tests/frontend.test.js

  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run backend tests
        run: node --test tests/backend.test.js

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t cv-manager:test .

      - name: Verify container starts
        run: |
          docker run -d --name cv-test -p 3010:3010 -p 3011:3011 cv-manager:test
          for i in 1 2 3 4 5; do
            curl -sf http://localhost:3010/api/profile && break
            echo "Waiting for server to start (attempt $i)..."
            sleep 3
          done
          curl -f http://localhost:3010/api/profile || (docker logs cv-test && exit 1)
          curl -f http://localhost:3011/api/profile || (docker logs cv-test && exit 1)
          docker stop cv-test
