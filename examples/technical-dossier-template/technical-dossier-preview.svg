<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Technical dossier template preview</title>
  <desc id="desc">Generated preview image for the Site Manager technical dossier template.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#111" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8f6ee"/>
      <stop offset="1" stop-color="#e7e3d4"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect width="1280" height="720" fill="#080808"/>
  <rect x="52" y="42" width="1176" height="636" rx="26" fill="url(#paper)" filter="url(#shadow)"/>
  <rect x="52" y="42" width="1176" height="636" rx="26" fill="url(#grid)"/>

  <line x1="52" y1="118" x2="1228" y2="118" stroke="#050505" stroke-width="4"/>
  <text x="90" y="92" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="24" font-weight="700" fill="#050505">SITE MANAGER / TECHNICAL DOSSIER TEMPLATE</text>
  <text x="1080" y="92" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="18" fill="#444" text-anchor="end">GENERIC</text>

  <text x="90" y="198" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="72" font-weight="800" letter-spacing="-3" fill="#050505">Your Name</text>
  <text x="94" y="236" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="20" fill="#333">Technical Professional · Systems · Projects · Proof-of-Work</text>

  <rect x="90" y="286" width="348" height="232" rx="18" fill="#fbfaf6" stroke="#050505" stroke-width="3"/>
  <text x="118" y="330" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#050505">PROFILE SIGNAL</text>
  <line x1="118" y1="350" x2="410" y2="350" stroke="#050505" stroke-opacity="0.25" stroke-width="2"/>
  <text x="118" y="386" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="20" fill="#111">Target role</text>
  <text x="118" y="422" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="20" fill="#111">Core strengths</text>
  <text x="118" y="458" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="20" fill="#111">Measurable outcomes</text>
  <text x="118" y="494" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="20" fill="#111">Portfolio evidence</text>

  <rect x="466" y="286" width="348" height="232" rx="18" fill="#fbfaf6" stroke="#050505" stroke-width="3"/>
  <text x="494" y="330" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#050505">SECTIONS</text>
  <line x1="494" y1="350" x2="786" y2="350" stroke="#050505" stroke-opacity="0.25" stroke-width="2"/>
  <g font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="20" fill="#111">
    <text x="494" y="386">01 Summary</text>
    <text x="494" y="422">02 Experience</text>
    <text x="494" y="458">03 Projects</text>
    <text x="494" y="494">04 Skills matrix</text>
  </g>

  <rect x="842" y="286" width="296" height="232" rx="18" fill="#101010" stroke="#050505" stroke-width="3"/>
  <text x="870" y="330" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="18" font-weight="700" fill="#f4f3ee">TEMPLATE READY</text>
  <line x1="870" y1="350" x2="1110" y2="350" stroke="#f4f3ee" stroke-opacity="0.28" stroke-width="2"/>
  <text x="870" y="388" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="19" fill="#f4f3ee">Standalone HTML</text>
  <text x="870" y="424" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="19" fill="#f4f3ee">No database required</text>
  <text x="870" y="460" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="19" fill="#f4f3ee">No personal data</text>
  <text x="870" y="496" font-family="IBM Plex Sans, Inter, system-ui, sans-serif" font-size="19" fill="#f4f3ee">Export starting point</text>

  <rect x="90" y="574" width="1048" height="48" rx="24" fill="#050505"/>
  <text x="614" y="606" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, monospace" font-size="18" fill="#f4f3ee">examples/technical-dossier-template/index.html</text>
</svg>
